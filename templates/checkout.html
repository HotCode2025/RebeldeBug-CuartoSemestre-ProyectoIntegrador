{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido | Pastas a Colores</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-image: url("{% static 'imagenes/Mantel.PNG' %}"); 
            background-size: 240px; 
            background-repeat: repeat; 
            background-color: rgba(0, 0, 0, 0.3); /* Velo negro al 60% */
            background-blend-mode: multiply; 
            color: #1C1C1C; 
            margin: 0; 
            padding: 0; 
        }
        .main-header {
            background-color: #1C1C1C; 
            width: 100%;
            padding: 2rem 0; 
            display: flex;
            justify-content: center; 
            align-items: center; 
            margin: 0;
        }
        .logo-container img {
            width: 250px; 
            height: auto;
            display: block;
            border-radius: 50%; 
        }
        .checkout-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2.5rem;
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #EAEAEA;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            border-bottom: 2px solid #F5F5F5;
            padding-bottom: 1rem;
            font-size: 1.8rem;
            color: #1C1C1C;
        }
        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #CCCCCC;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            background-color: #FAFAFA;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4A7C59;
            background-color: white;
        }
        .account-toggle {
            background: #F4F4F4;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 0.95rem;
        }
        .account-toggle a {
            color: #4A7C59;
            font-weight: bold;
            text-decoration: none;
        }
        .btn-submit {
            background-color: #4A7C59;
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #385E3B;
        }
        .btn-back {
            display: block;
            text-align: center;
            color: #777777;
            text-decoration: none;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Encabezado Negro Institucional -->
    <header class="main-header">
        <div class="logo-container">
            <img src="{% static 'imagenes/Logo.PNG' %}" alt="Logo Pastas a Colores">
        </div>
    </header>

    <div class="checkout-container">
        <!-- Control de Flujo: Registro en caliente vs Login -->
        <div class="account-toggle" id="toggle-banner">
            ¿Ya compraste antes? <a href="#" onclick="toggleLoginForm(true)">Inicia sesión aquí</a>
        </div>
        <div class="account-toggle hidden" id="toggle-banner-back">
            ¿No tenés cuenta todavía? <a href="#" onclick="toggleLoginForm(false)">Cargar datos de envío</a>
        </div>

        <!-- FORMULARIO INTEGRADO -->
        <form id="form-envio" action="" method="POST">
            {% csrf_token %}
            <!-- Tu input oculto para pasar el total a Mercado Pago -->
            <input type="hidden" id="total_final_input" name="total_final_input" value="0">
            
            <!-- Bloque del Domicilio de Entrega -->
            <div id="shipping-fields">
                <h2>Datos para el Envío</h2>
                <div class="form-group">
                    <label for="nombre">Nombre de quien recibe</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Melina Menu" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono de contacto</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: 2604XXXXXX" required>
                </div>
                <div class="form-group">
                    <label for="domicilio">Domicilio (Calle y Altura)</label>
                    <input type="text" id="domicilio" name="domicilio" placeholder="Ej: Av. San Martín 150" required>
                </div>
                <div class="form-group">
                    <label for="entrecalles">Entre calles</label>
                    <input type="text" id="entrecalles" name="entrecalles" placeholder="Ej: Entre Villegas y J. Corvalán" required>
                </div>
                <div class="form-group">
                    <label for="horario">Rango Horario de Entrega</label>
                    <select id="horario" name="horario" required>
                        <option value="" disabled selected>Seleccioná un rango horario</option>
                        <option value="Mañana (11:00 a 14:00 hrs)">Mañana: 11:00 a 14:00 hrs</option>
                        <option value="Tarde (19:00 a 21:00 hrs)">Tarde: 19:00 a 21:00 hrs</option>
                    </select>
                </div>
            </div>

            <!-- Bloque de Autenticación de Usuarios -->
            <h2 id="account-title">Crear Cuenta de Cliente</h2>
            <div class="form-group">
    <label for="telefono_usuario">Número de Teléfono (Será tu usuario de ingreso)</label>
    <input type="tel" id="telefono_usuario" name="telefono_usuario" required placeholder="Ej: 2604507091">
</div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Crea una contraseña para tus próximas compras">
            </div>

            <button type="submit" class="btn-submit" id="btn-text">Proceder al Pago con Mercado Pago</button>
        </form>
        
        <a href="{% url 'home' %}" class="btn-back">← Volver a la tienda</a>
    </div>

    <script>
        // Mantiene tu lógica original para recuperar el total acumulado de tu carrito
        document.getElementById('form-envio').addEventListener('submit', function(e) {
            let totalMemory = localStorage.getItem('total_carrito') || '0';
            totalMemory = totalMemory.replace('$', '').trim();
            document.getElementById('total_final_input').value = totalMemory;
        });

        // Alternancia visual para cambiar entre Modo Registro y Modo Login sin recargar la web
        function toggleLoginForm(showLogin) {
            const shippingFields = document.getElementById('shipping-fields');
            const accountTitle = document.getElementById('account-title');
            const btnText = document.getElementById('btn-text');
            const toggleBanner = document.getElementById('toggle-banner');
            const toggleBannerBack = document.getElementById('toggle-banner-back');
            const shippingInputs = shippingFields.querySelectorAll('input, select');

            if (showLogin) {
                shippingFields.classList.add('hidden');
                toggleBanner.classList.add('hidden');
                toggleBannerBack.classList.remove('hidden');
                accountTitle.innerText = "Iniciar Sesión";
                btnText.innerText = "Ingresar y Ver Mi Pedido";
                
                // Remueve obligatoriedad de envío si solo se va a loguear
                shippingInputs.forEach(input => input.removeAttribute('required'));
            } else {
                shippingFields.classList.remove('hidden');
                toggleBanner.classList.remove('hidden');
                toggleBannerBack.classList.add('hidden');
                accountTitle.innerText = "Crear Cuenta de Cliente";
                btnText.innerText = "Proceder al Pago con Mercado Pago";
                
                // Restaura los campos obligatorios para el delivery
                shippingInputs.forEach(input => input.setAttribute('required', ''));
            }
        }
    </script>
</body>
</html>
